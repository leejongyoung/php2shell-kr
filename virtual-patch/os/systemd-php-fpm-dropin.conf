# ============================================================================
# PHP2Shell 임시 완화: PHP-FPM systemd drop-in (OS 메모리 상한)
# ----------------------------------------------------------------------------
# 목적    : pool 에서 memory_limit=-1 로 둔 대신 OS 수준 상한으로 가용성 경계를 만든다.
#           한도 초과 시 해당 워커만 종료되고 서비스는 계속된다(OOMPolicy=continue).
# 한계    : 가용성 경계일 뿐 코드 실행/정보 노출을 막지 못한다. 공격 자체의 완화책이 아니다.
#           RLIMIT_AS / RLIMIT_DATA(LimitAS=, LimitDATA=)는 쓰지 말 것: PHP 는 이 제한이 취약한
#           할당 실패를 유발할 수 있다고 밝혔다.
# 적용 전 : 값(예: 2G)은 평상시 pool 전체 사용량 + 여유로 정한다. 너무 작으면 정상 워커가 죽는다.
# 설치    : /etc/systemd/system/php8.4-fpm.service.d/php2shell.conf (유닛 이름은 환경에 맞게)
#           systemctl daemon-reload && systemctl restart <유닛>
# 롤백    : 파일 삭제 후 daemon-reload, restart.
# 상태    : 미검증(컨테이너 시험 안 함, 눈으로 검토).
# ============================================================================
[Service]
MemoryHigh=1536M
MemoryMax=2G
OOMPolicy=continue
