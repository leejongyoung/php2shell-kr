; ============================================================================
; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) 임시 완화: PHP-FPM pool 조각
; ----------------------------------------------------------------------------
; 목적    : php_admin_* 로 지정해 앱이 ini_set/.user.ini 로 되돌릴 수 없게 한다.
; 한계    : 완전한 완화책이 아니다(PHP 공식 입장). 일부 경로만 줄이며 우회될 수 있다.
;           웹셸 설치 후의 피해는 막지 못한다. 근본 조치는 패치다.
; 적용 전 : 이 내용을 사용 중인 pool 파일([www] 등) 안에 붙여 넣고 `php-fpm -t` 로 확인.
;           스테이징에서 업로드·세션 기능을 시험한다.
; 롤백    : 추가한 줄을 삭제하고 `php-fpm -t` 후 reload.
; ============================================================================

php_admin_flag[session.upload_progress.enabled] = off

; memory_limit=-1 은 메모리 상한을 없앤다. 반드시 OS 수준 상한(systemd MemoryMax,
; cgroup, 컨테이너 mem_limit)을 함께 설정할 것(os/systemd-php-fpm-dropin.conf 참고).
; RLIMIT_AS / RLIMIT_DATA 로 대체하지 말 것: PHP 는 이 제한이 취약한 할당 실패를
; 유발할 수 있다고 밝혔다.
php_admin_value[memory_limit] = -1

php_admin_value[post_max_size] = @@POST_MAX@@
php_admin_value[upload_max_filesize] = @@UPLOAD_MAX@@

; session.auto_start=0 : 출처 Xint. session_start() 없이 $_SESSION 을 쓰는 페이지의
; 세션 기능이 멈출 수 있어 기본은 주석 처리. 영향 검토 후에만 활성화.
;php_admin_value[session.auto_start] = 0

; PHP 8.5 전용. 다른 버전에서는 활성화하지 말 것.
;php_admin_value[fatal_error_backtraces] = 0
