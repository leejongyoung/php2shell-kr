name: extended-verification

# docs/verification.ko.md 의 "확인하지 못한 것" 중 실제 환경이 있어야 하는 항목을 실행해 확인한다.
# 기본 ci.yml 과 분리한 이유: 외부 네트워크·VM·IIS 설치 등으로 오래 걸리고 환경 변동이 커서, 실패해도 기본 CI 와 구분해 보기 위해서다.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose-socket:
    name: docker compose unix socket (cap_drop ALL)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/compose_socket_check.sh

  gpg-signatures:
    name: GPG signature verification (tarball, backport branches)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/gpg_source_check.sh

  backport-build:
    name: backport branch build (${{ matrix.branch }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        branch: ["7.4", "8.0", "8.1"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/backport_build_check.sh ${{ matrix.branch }}

  kubernetes:
    name: kubernetes (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: helm/kind-action@1544676c07bb3570fcb70166beaa07c4528fd4aa # v1.15.1
      - run: sh tests/k8s_check.sh

  homebrew:
    name: homebrew php (macos)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh tests/brew_check.sh

  linux-host:
    name: linux host (systemd, auditd, nftables)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sudo sh tests/linux_host_check.sh

  freebsd:
    name: freebsd 14 (pkg)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cross-platform-actions/action@e0b9770014ba65d5e0815f15b74031c3a635f641 # v1.6.0
        with:
          operating_system: freebsd
          version: "14.3"
          shell: sh
          run: sudo sh tests/freebsd_check.sh

  windows-real:
    name: windows (ACL, IIS FastCGI, plan, cp949)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - name: install fixed PHP build (SHA-256 pinned, same as ci.yml)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          # windows.php.net 이 연결을 끊는 경우가 있어 3회까지 재시도한다 (해시는 그대로 검증)
          foreach ($try in 1..3) {
            try { Invoke-WebRequest "https://windows.php.net/downloads/releases/php-8.4.27-nts-Win32-vs17-x64.zip" -OutFile fixed.zip; break }
            catch { if ($try -eq 3) { throw }; Start-Sleep -Seconds (5 * $try) }
          }
          if ((Get-FileHash fixed.zip -Algorithm SHA256).Hash.ToLower() -ne '93bd8a815a52156606fb906d0573437908c61f96e2cc52c03a51e36a41bf5236') { throw 'fixed.zip checksum mismatch' }
          Expand-Archive fixed.zip -DestinationPath C:\php-fixed
      - name: real ACL trust decisions
        run: python tests/windows_acl_check.py
      - name: real ACL trust decisions (quickcheck.ps1 / .bat, Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/windows_ps1_acl_check.ps1
      - name: IIS web.config, FastCGI, patch plan, cp949
        shell: pwsh
        run: ./tests/windows_iis_check.ps1
