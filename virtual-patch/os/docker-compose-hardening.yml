# ============================================================================
# PHP2Shell 임시 완화: Docker Compose 하드닝 예시 (php-fpm 서비스)
# ----------------------------------------------------------------------------
# 목적    : memory_limit=-1 을 쓸 때 필요한 OS 수준 상한(mem_limit)과 침해 후 피해 축소
#           (읽기 전용 rootfs, 불필요한 권한 제거, 외부 통신 차단).
# 한계    : 취약점 자체를 막지 않는다. 패치 버전 이미지로 교체하기 전까지의 완화일 뿐이다.
#           RLIMIT_AS/RLIMIT_DATA(ulimits as/data)는 쓰지 말 것.
# 적용 전 : 예시이므로 이미지/볼륨/네트워크 이름을 환경에 맞게 수정하고 `docker compose config` 로 확인.
#           read_only 로 앱이 쓰는 경로(세션, 업로드)는 tmpfs/볼륨이 필요하다.
# 롤백    : 이 항목들을 제거하고 `docker compose up -d`.
#
# cap_drop: ALL 과 cap_add 에 대해 (실측: php:8.4.27-fpm, 공식 이미지, TCP 9000 listen)
#   - cap_drop: [ALL] 만 쓰면 root 로 뜬 php-fpm 마스터가 워커를 www-data 로 전환하지 못한다.
#     로그: "failed to setgid(33): Operation not permitted", "child failed to initialize"
#     (워커가 계속 종료·재시작되어 요청에 응답하지 못한다).
#   - cap_add: [SETUID, SETGID] 를 더하면 마스터는 root, 워커 2개는 uid 33(www-data) 로 뜨고
#     nginx 컨테이너에서 fastcgi 로 요청해 HTTP 200 응답을 받았다(read_only + tmpfs + no-new-privileges 포함).
#   - 이 이미지는 TCP 로 listen 하므로 CHOWN 은 필요 없었다. unix 소켓에 listen.owner/listen.group
#     또는 chown 이 필요한 구성이면 CHOWN 을 추가해야 할 수 있다(미검증). 이미지/pool 설정이
#     다르면 `docker compose logs php` 에서 "Operation not permitted" 를 확인해 조정할 것.
# ============================================================================
services:
  php:
    image: php:8.4-fpm
    mem_limit: 1g
    memswap_limit: 1g
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/php/sessions:rw,noexec,nosuid,size=32m
    cap_drop:
      - ALL
    cap_add:
      # root 마스터가 워커를 www-data 로 낮추는 데 필요한 최소 권한
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      - backend

networks:
  backend:
    # internal: true 이면 외부(인터넷)로 나가는 연결이 차단된다. DB 등 내부 통신만 가능.
    internal: true
