# ============================================================================
# PHP2Shell 임시 완화: multipart/form-data 차단 (업로드가 없는 사이트 전용)
# ----------------------------------------------------------------------------
# 목적    : 파일 업로드가 전혀 없는 사이트에서 multipart 요청 경로를 차단한다.
# 한계    : 완전한 완화책이 아니다. 다른 Content-Type 경로는 막지 못하며 대소문자/공백
#           변형은 정규식으로 일부만 처리한다. 업로드 기능이 있으면 절대 적용하지 말 것.
# 적용 전 : 아래 두 부분을 나누어 넣고 `nginx -t`. 로그인/폼/API 가 multipart 를 쓰는지 확인.
# 롤백    : include 와 if 블록을 제거하고 nginx -t 후 reload.
#
# 배치:
#  (1) 이 파일의 map 블록: http {} 컨텍스트에서 include (server 안에 두면 오류).
#  (2) location 안의 if 문: PHP 를 처리하는 location 안에 직접 넣는다.
#      location ~ \.php$ {
#          if ($php2shell_block_multipart) { return 403; }
#          ...
#      }
# ============================================================================

map $content_type $php2shell_block_multipart {
    default 0;
    "~*^\s*multipart/form-data" 1;
}
