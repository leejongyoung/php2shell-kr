# ============================================================================
# PHP2Shell (CVE-2026-109618 / CVE-2026-109619) 임시 완화: ModSecurity 규칙
# ----------------------------------------------------------------------------
# 목적    : 공개 문서에 나온 요청 형태 표지(PHP_SESSION_UPLOAD_PROGRESS 필드명, 과도한
#           대괄호 중첩, 과다 인자/파일, chunked multipart)를 탐지/차단한다.
# 한계    : 완전한 완화책이 아니다(PHP 공식 입장). 문자셋 변형, RFC 2231/5987 인코딩,
#           대용량 본문 등으로 우회될 수 있다. 정상 요청을 막을 수 있다. 패치까지의 시간 벌기용.
# 호환    : ModSecurity v2/v3 + OWASP CRS. 로컬 규칙 ID 91001-91010 사용(CRS 와 충돌 시 변경).
# 첫 적용 : SecRuleEngine DetectionOnly 로 시작해 감사 로그의 오탐을 확인한 뒤 On 으로 전환.
#           (규칙은 deny 를 쓰므로 DetectionOnly 에서는 기록만 하고 차단하지 않는다.)
# 적용 전 : 웹서버 설정 테스트(nginx -t / apachectl configtest). 오탐 시 개별 규칙을
#           SecRuleRemoveById 로 제외.
# 롤백    : Include 제거 후 reload, 또는 SecRuleRemoveById 91001-91010.
# ============================================================================

# 91001: 업로드 진행률 마커 필드명이 인자 이름에 있음
SecRule ARGS_NAMES "@contains php_session_upload_progress" \
    "id:91001,phase:2,t:none,t:urlDecodeUni,t:lowercase,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: PHP_SESSION_UPLOAD_PROGRESS marker in argument name',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'CRITICAL'"

# 91002: multipart 파트 헤더에 마커가 있음 (대소문자 무시)
SecRule MULTIPART_PART_HEADERS "@contains php_session_upload_progress" \
    "id:91002,phase:2,t:none,t:urlDecodeUni,t:lowercase,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: PHP_SESSION_UPLOAD_PROGRESS marker in multipart part header',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'CRITICAL'"

# 91003: 쿠키 이름에 마커가 있음
SecRule REQUEST_COOKIES_NAMES "@contains php_session_upload_progress" \
    "id:91003,phase:1,t:none,t:urlDecodeUni,t:lowercase,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: PHP_SESSION_UPLOAD_PROGRESS marker in cookie name',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'CRITICAL'"

# 91004: 인자 이름의 여는 대괄호가 8개 이상이면 거부한다(중첩의 보수적 대리 지표).
# 닫는 괄호가 없어도 센다. 정상 앱도 여는 괄호가 많으면 오탐이므로 임계값 {8} 을 조정한다.
# 시작 앵커와 possessive 반복(*+)으로 입력을 한 방향으로만 스캔해 이차 시간 역추적을 피한다.
SecRule ARGS_NAMES "@rx ^[^\[]*+(?:\[[^\[]*+){8}" \
    "id:91004,phase:2,t:none,t:urlDecodeUni,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: excessive bracket nesting in argument name (threshold 8)',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'CRITICAL'"

# 91005: 인자 수 과다 (임계값 500. 대형 폼은 조정). 참고: modsecurity.conf 의 SecArgumentsLimit 기본값 1000 을 넘으면 엔진이 먼저 400 으로 거부하므로 임계값은 그보다 낮아야 규칙이 동작한다.
SecRule &ARGS "@gt 500" \
    "id:91005,phase:2,t:none,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: too many request arguments',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'ERROR'"

# 91006: 업로드 파일 수 과다 (임계값 20. 빈 filename="" 파트 다수 패턴 포함).
SecRule &FILES "@gt 20" \
    "id:91006,phase:2,t:none,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: too many multipart file parts',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'ERROR'"

# 91007: Transfer-Encoding: chunked 를 쓰는 multipart 요청
SecRule REQUEST_HEADERS:Transfer-Encoding "@contains chunked" \
    "id:91007,phase:1,t:none,t:lowercase,chain,deny,status:403,log,auditlog,\
    msg:'PHP2Shell: chunked multipart request',\
    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'ERROR'"
    SecRule REQUEST_HEADERS:Content-Type "@rx ^\s*multipart/" "t:none,t:lowercase"

# 91010 (선택): 업로드가 필요 없는 사이트에서 모든 multipart/form-data 차단. 기본 비활성.
# 업로드가 있으면 절대 활성화하지 말 것.
#SecRule REQUEST_HEADERS:Content-Type "@rx ^\s*multipart/form-data" \
#    "id:91010,phase:1,t:none,t:lowercase,deny,status:403,log,auditlog,\
#    msg:'PHP2Shell: multipart/form-data denied (no-upload site)',\
#    tag:'CVE-2026-109618',tag:'CVE-2026-109619',tag:'php2shell',severity:'CRITICAL'"
