; ============================================================================
; PHP2Shell (CVE-2026-109618 / CVE-2026-109619) 임시 완화: php.ini 조각
; ----------------------------------------------------------------------------
; 목적    : 공격 경로 일부(업로드 진행률 세션, 대용량 요청)를 줄여 패치까지 시간을 번다.
; 한계    : PHP 공식 공지는 완전한 완화책이 없다고 밝힌다. 이 파일은 일부 경로만 줄이며
;           우회될 수 있다. 근본 조치는 패치 버전(8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 / 8.6.0RC4)이다.
;           이 파일은 코드 실행 후의 피해(웹셸, 자격증명 탈취)는 막지 못한다.
; 적용 전 : 스테이징에서 `php -n -c 이 파일 -r "echo 1;"` 로 구문을 확인하고,
;           업로드/진행률 표시 기능 사용 여부를 점검한다.
; 롤백    : conf.d 에 복사한 파일을 삭제(또는 이름을 .disabled 로 변경)하고
;           PHP-FPM/Apache 를 reload 한다.
; 주의    : memory_limit 은 이 파일에 넣지 않는다. php.ini 값은 .htaccess/ini_set 으로 덮어쓸
;           수 있으므로 pool 설정의 php_admin_value(php-fpm-pool-mitigation.conf) 또는 Apache
;           php_admin_value(apache/php2shell-mitigation.conf)에서만 지정한다.
; ============================================================================

; 업로드 진행률 추적(PHP_SESSION_UPLOAD_PROGRESS 마커 경로)을 끈다.
session.upload_progress.enabled = 0

; 요청 크기 상한. 업로드가 필요 없으면 8M, 필요하면 32M 수준. upload_max_filesize 는 post_max_size 보다 작게 둔다.
post_max_size = @@POST_MAX@@
upload_max_filesize = @@UPLOAD_MAX@@

; PHP 8.5 전용: 치명적 오류 backtrace 비활성화. 다른 버전에서는 이 줄을 활성화하지 말 것.
; fatal_error_backtraces = 0
