# ============================================================================
# PHP2Shell (CVE-2026-109618 / CVE-2026-109619) 임시 완화: nginx 조각
# ----------------------------------------------------------------------------
# 목적    : 요청 본문/헤더 크기와 요청 빈도를 제한한다.
# 한계    : 완전한 완화책이 아니다(PHP 공식 입장). 일부 경로만 줄이며 우회될 수 있다.
#           웹셸 설치 후 피해는 막지 못한다. 근본 조치는 패치다.
# 적용 전 : http {} 컨텍스트 안에서 include 하고 `nginx -t` 후 reload. 업로드를 스테이징에서 시험.
# 롤백    : include 줄을 제거하고 nginx -t 후 reload.
# ============================================================================

client_max_body_size @@POST_MAX@@;
client_body_buffer_size 128k;

# fastcgi_request_buffering 은 기본값(on)을 유지한다. off 로 두면 불완전한 본문이
# PHP 까지 스트리밍되어 요청 형태 제한의 효과가 줄어든다. 의도적으로 끄지 말 것.
fastcgi_request_buffering on;

client_header_buffer_size 2k;
large_client_header_buffers 4 8k;
client_body_timeout 15s;
client_header_timeout 15s;

# 빈도 제한 예시. 서버 환경에 맞게 rate 를 조정하고 PHP location 에서 limit_req 로 사용.
#   location ~ \.php$ { limit_req zone=php2shell_req burst=20 nodelay; ... }
limit_req_zone $binary_remote_addr zone=php2shell_req:10m rate=10r/s;
limit_req_status 429;
