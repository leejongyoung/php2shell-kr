# ============================================================================
# PHP2Shell (CVE-2026-109618 / CVE-2026-109619) 임시 완화: Apache httpd 조각
# ----------------------------------------------------------------------------
# 목적    : 요청 크기/헤더 상한을 두고, mod_php 사용 시 php_admin_* 로 PHP 설정을 고정한다.
# 한계    : 완전한 완화책이 아니다(PHP 공식 입장). 요청 형태 제한은 일부 경로만 줄이며
#           우회될 수 있다. 웹셸 설치 후 피해는 막지 못한다. 근본 조치는 패치다.
# 적용 전 : `apachectl configtest`(또는 httpd -t) 후 reload. 업로드 기능을 스테이징에서 시험.
# 롤백    : Include 줄(또는 이 파일)을 제거하고 configtest 후 reload.
# 참고    : LimitRequestBody 는 chunked 전송 본문도 Apache 가 누적 계수해 제한한다.
#           PHP-FPM(proxy_fcgi) 사용 시 php_* 블록은 적용되지 않는다(pool 파일 사용).
# ============================================================================

# 본문 크기 상한(바이트). @@POST_MAX@@ 에 해당.
LimitRequestBody @@POST_MAX_BYTES@@
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 8190

# mod_php 전용. mod_php 가 없으면 무시된다.
<IfModule mod_php.c>
    php_admin_flag session.upload_progress.enabled off
    # memory_limit=-1: OS 수준 상한(cgroup/MemoryMax/컨테이너 한도) 필수. RLIMIT_AS/RLIMIT_DATA 사용 금지.
    php_admin_value memory_limit -1
    php_admin_value post_max_size @@POST_MAX@@
    php_admin_value upload_max_filesize @@UPLOAD_MAX@@
    # session.auto_start=0 는 Xint 권고이나 $_SESSION 사용 페이지가 깨질 수 있어 주석 처리.
    #php_admin_value session.auto_start 0
</IfModule>
<IfModule mod_php7.c>
    php_admin_flag session.upload_progress.enabled off
    php_admin_value memory_limit -1
    php_admin_value post_max_size @@POST_MAX@@
    php_admin_value upload_max_filesize @@UPLOAD_MAX@@
</IfModule>
<IfModule mod_php8.c>
    php_admin_flag session.upload_progress.enabled off
    php_admin_value memory_limit -1
    php_admin_value post_max_size @@POST_MAX@@
    php_admin_value upload_max_filesize @@UPLOAD_MAX@@
</IfModule>
